services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-circular}
      POSTGRES_USER: ${POSTGRES_USER:-circular}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circular}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - circular-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://circular:circular@postgres:5432/circular
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    command: ["uv", "run", "circular-api"]
    environment:
      DATABASE_URL: postgresql+psycopg://circular:circular@postgres:5432/circular
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    command: ["uv", "run", "circular-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://circular:circular@postgres:5432/circular
      CIRCULAR_POLL_INTERVAL_SECONDS: ${CIRCULAR_POLL_INTERVAL_SECONDS:-1}
      CIRCULAR_REPOSITORY_CACHE_ROOT: /var/lib/circular/repositories
      CIRCULAR_WORKTREE_ROOT: /var/lib/circular/worktrees
      CIRCULAR_ARTIFACT_ROOT: /var/lib/circular/artifacts
      CIRCULAR_DOCKER_WORKTREE_ROOT: ${CIRCULAR_DOCKER_WORKTREE_ROOT:-${CIRCULAR_EXECUTION_HOST_ROOT:-${PWD}/.circular}/worktrees}
      CIRCULAR_RUNNER_IMAGE: ${CIRCULAR_RUNNER_IMAGE:-circular-runner:dev}
      CIRCULAR_RUNNER_CPU_LIMIT: ${CIRCULAR_RUNNER_CPU_LIMIT:-1}
      CIRCULAR_RUNNER_MEMORY_LIMIT_MB: ${CIRCULAR_RUNNER_MEMORY_LIMIT_MB:-2048}
    volumes:
      - type: bind
        source: ${CIRCULAR_EXECUTION_HOST_ROOT:-${PWD}/.circular}
        target: /var/lib/circular
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  circular-postgres:
