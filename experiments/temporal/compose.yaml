name: circular-temporal-eval
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: temporal-eval
      POSTGRES_DB: temporal_eval
    ports:
      - '127.0.0.1:55492:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d temporal_eval']
      interval: 1s
      timeout: 2s
      retries: 30
  temporal:
    image: temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--headless', '--db-filename', '/home/temporal/temporal.db']
    ports:
      - '127.0.0.1:57233:7233'
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - temporal-state:/home/temporal
volumes:
  temporal-state:
