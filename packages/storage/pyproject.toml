[project]
name = "circular-storage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "circular-domain",
  "circular-events",
  "circular-orchestration",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[tool.uv.sources]
circular-domain = { workspace = true }
circular-events = { workspace = true }
circular-orchestration = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circular"]
