[project]
name = "circular-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "circular-domain",
  "circular-storage",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
circular-api = "circular.api.main:run"

[tool.uv.sources]
circular-domain = { workspace = true }
circular-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circular"]
