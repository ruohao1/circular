[project]
name = "circular-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "circular-agents",
  "circular-git",
  "circular-runners",
  "circular-runtimes",
  "circular-storage",
  "pydantic-settings>=2.8,<3",
]

[project.scripts]
circular-worker = "circular.worker.main:run"

[tool.uv.sources]
circular-agents = { workspace = true }
circular-git = { workspace = true }
circular-runners = { workspace = true }
circular-runtimes = { workspace = true }
circular-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circular"]
